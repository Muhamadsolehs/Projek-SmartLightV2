# Supabase CLI Project Configuration
project_id = "xzzjfwstrpayhnpymqpq"

# Gateway JWT Verification Configuration for Edge Functions
# Hardware endpoints authenticate using custom X-Device-Code & X-Device-Token headers
# verified in function code via verifyDeviceAuth(), so gateway JWT check must be disabled.

[functions.device-command-poll]
verify_jwt = false

[functions.device-command-ack]
verify_jwt = false

[functions.device-status]
verify_jwt = false

[functions.device-telemetry]
verify_jwt = false

# device-provisioning verifies admin user session and role internally via verifyAdminAuth(req)
[functions.device-provisioning]
verify_jwt = false

# system-heartbeat verifies custom HEARTBEAT_SECRET header internally from scheduler
[functions.system-heartbeat]
verify_jwt = false

# telegram-notify verifies TELEGRAM_INTERNAL_SECRET header internally for S2S calls
[functions.telegram-notify]
verify_jwt = false

# device-offline-check scheduled background job / cron
[functions.device-offline-check]
verify_jwt = false

# send-telegram-alert bridges dashboard test requests
[functions.send-telegram-alert]
verify_jwt = false
