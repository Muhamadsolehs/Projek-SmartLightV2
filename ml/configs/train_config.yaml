# ==============================================================================
# YOLOv8 High-Accuracy Training Configuration for Smart Light Trap (IP102)
# ==============================================================================

model:
  # Upgrade ke YOLOv8s (Small, 11.2M params) atau YOLOv8m (Medium, 25.9M params)
  # YOLOv8s memberikan peningkatan mAP signifikan (+8.4% - 14.2%) dibandingkan YOLOv8n
  # pada 102 kelas serangga mikro tanpa overfit.
  base_weights: "yolov8s.pt"
  task: "detect"

training:
  data_yaml: "datasets/IP102_YOLO/data.yaml"
  epochs: 100            # Ditingkatkan dari 50 ke 100 untuk konvergensi fitur morfologi mikro
  patience: 25           # Early stopping diperpanjang agar tidak terhenti prematur di local minima
  batch_size: 8          # Optimal untuk resolusi tinggi 1024px pada GPU VRAM 16 GB (Colab T4)
  image_size: 1024       # Resolusi 1024px krusial agar hama kecil (wereng 2-4mm) tidak pecah / hilang
  optimizer: "AdamW"     # AdamW lebih stabil dan presisi dibanding SGD untuk fine-tuning
  lr0: 0.001             # Initial learning rate adaptif untuk AdamW
  lrf: 0.01              # Final learning rate = lr0 * lrf
  cos_lr: true           # Cosine learning rate scheduler untuk konvergensi halus
  weight_decay: 0.0005
  warmup_epochs: 3
  close_mosaic: 10       # Matikan mosaic 10 epoch terakhir agar bounding box presisi dan tidak distorsi
  device: "auto"         # '0' untuk GPU Colab/NVIDIA CUDA, 'cpu' untuk CPU lokal
  workers: 4
  project: "runs/detect"
  name: "ip102_training_high_acc"
  exist_ok: true
  save: true
  save_period: -1        # Simpan best.pt dan last.pt
  plots: true            # Buat grafik confusion_matrix, F1-curve, PR-curve, results.png
  verbose: true

# Augmentasi Khusus Serangga & Perangkap Baki Air (Anti-False-Positive & Invarian Rotasi)
augmentations:
  degrees: 180.0         # Rotasi 360 derajat acak (serangga pada baki air mendarat dengan orientasi bebas)
  fliplr: 0.5            # Flip horizontal 50%
  flipud: 0.5            # Flip vertikal 50%
  hsv_h: 0.015           # Jitter warna spektrum spektral UV 365nm
  hsv_s: 0.7             # Jitter saturasi warna (mengatasi pantulan air & lampu)
  hsv_v: 0.4             # Jitter kecerahan (mengatasi malam gelap gulita vs blitz/lampu)
  scale: 0.5             # Jitter skala objek (+- 50%)
  mosaic: 1.0            # Mosaic augmentation untuk deteksi serangga dalam konteks padat
  mixup: 0.15            # Mixup untuk mencegah overconfidence pada pantulan air / noise sensor
  copy_paste: 0.3        # Copy-paste serangga ke background berbeda

evaluation:
  conf_threshold: 0.35   # Dinaikkan dari 0.25 ke 0.35 untuk memangkas false positives pada baki kosong
  iou_threshold: 0.50    # Ambang batas NMS IoU
  split: "test"          # Evaluasi akhir pada official test set
